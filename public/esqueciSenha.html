<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Se Mexe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'neon-blue': '#00E5FF', 'neon-pink': '#FF007F', 'dark-base': '#121212', 'dark-surface': '#1E1E1E' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-dark-base text-white font-sans flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-md bg-dark-surface p-8 rounded-xl shadow-lg border border-gray-800">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-dark-base rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-700">
                <i class="fa-solid fa-lock text-2xl text-neon-blue"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Recuperar Senha</h2>
            <p class="text-gray-400 text-sm mt-2">Informe seu e-mail cadastrado e enviaremos um link para você redefinir sua senha.</p>
        </div>

        <form id="form-esqueci" class="space-y-4">
            <div>
                <label class="block text-gray-400 text-sm mb-1">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required class="w-full bg-[#121212] border border-gray-700 rounded p-3 text-white focus:border-neon-blue focus:outline-none transition">
            </div>

            <button type="submit" id="btn-enviar" class="w-full bg-neon-blue text-black font-bold py-3 rounded hover:bg-white hover:shadow-[0_0_15px_rgba(0,229,255,0.5)] transition duration-300">
                Enviar Link de Recuperação
            </button>
        </form>

        <p id="msg" class="text-center mt-4 text-sm font-bold min-h-[20px]"></p>

        <div class="mt-6 text-center border-t border-gray-700 pt-4">
            <a href="login.html" class="text-gray-400 hover:text-white text-sm flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Voltar para Login
            </a>
        </div>
    </div>

    <script>
        document.getElementById('form-esqueci').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn-enviar');
            const msg = document.getElementById('msg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
            msg.innerText = "";
            msg.className = "text-center mt-4 text-sm font-bold";

            try {
                const res = await fetch('/api/users/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok) {
                    msg.className = "text-center mt-4 text-sm font-bold text-green-400";
                    msg.innerHTML = '<i class="fa-solid fa-check-circle"></i> E-mail enviado! Verifique sua caixa de entrada.';
                    btn.innerHTML = "Link Enviado";
                } else {
                    msg.className = "text-center mt-4 text-sm font-bold text-neon-pink";
                    msg.innerText = data.error || "Erro ao enviar.";
                    btn.disabled = false;
                    btn.innerText = "Tentar Novamente";
                }
            } catch (err) {
                msg.className = "text-center mt-4 text-sm font-bold text-neon-pink";
                msg.innerText = "Erro de conexão com o servidor.";
                btn.disabled = false;
                btn.innerText = "Tentar Novamente";
            }
        });
    </script>
</body>
</html>
