<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Se Mexe - Detalhes</title>
  <link rel="shortcut icon" href="logo.png" type="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'neon-blue': '#00E5FF',
                    'neon-pink': '#FF007F',
                    'dark-base': '#121212',
                    'dark-surface': '#1E1E1E',
                    'dark-highlight': '#2D2D2D',
                },
                fontFamily: { sans: ['Poppins', 'sans-serif'] }
            }
        }
    }
  </script>
  <style>
    #nav-menu a { color: #d1d5db; font-weight: 500; transition: color 0.3s ease; }
    #nav-menu a:hover { color: #00E5FF; text-shadow: 0 0 8px rgba(0,229,255,0.5); }
    .hamburger-toggle .line { transition: all 0.3s ease-in-out; }
    .hamburger-toggle.active .line-1 { transform: translateY(8px) rotate(45deg); }
    .hamburger-toggle.active .line-2 { opacity: 0; }
    .hamburger-toggle.active .line-3 { transform: translateY(-8px) rotate(-45deg); }
  </style>
</head>
<body class="bg-dark-base text-gray-200 font-sans min-h-screen flex flex-col selection:bg-neon-blue selection:text-black">

  <header class="bg-dark-surface py-4 border-b border-gray-800 sticky top-0 z-50 shadow-lg shadow-black/50">
    <nav class="container mx-auto px-5 flex justify-between items-center relative">
        <a href="index.html" class="text-2xl font-bold text-neon-blue italic flex items-center gap-2 hover:scale-105 transition-transform">
            <i class="fa-solid fa-bolt"></i> Se Mexe
        </a>
        <button id="hamburger-btn" aria-label="Abrir menu" class="hamburger-toggle md:hidden flex flex-col gap-1.5 cursor-pointer z-50">
            <span class="line line-1 block w-6 h-0.5 bg-neon-blue"></span>
            <span class="line line-2 block w-6 h-0.5 bg-neon-blue"></span>
            <span class="line line-3 block w-6 h-0.5 bg-neon-blue"></span>
        </button>
        <div id="nav-menu-wrapper" class="fixed inset-0 bg-dark-base/95 backdrop-blur-md flex flex-col items-center justify-center gap-8 text-xl transition-transform duration-300 translate-x-full md:translate-x-0 md:static md:bg-transparent md:flex-row md:gap-8 md:text-base md:h-auto border-l border-gray-800 md:border-none">
            <ul id="nav-menu" class="flex flex-col md:flex-row gap-6 items-center"></ul>
        </div>
    </nav>
  </header>

  <main class="container mx-auto px-5 py-10 max-w-4xl">
    <a href="index.html" class="inline-flex items-center gap-2 text-neon-blue font-medium hover:text-white transition mb-8 btn-back">
      <i class="fa-solid fa-arrow-left"></i> Voltar para início
    </a>

    <div class="bg-dark-surface border border-gray-800 rounded-xl shadow-2xl p-6 md:p-8">
        <h1 id="titulo-atividade" class="text-3xl md:text-4xl font-bold text-white text-center mb-8 drop-shadow-md">Carregando...</h1>

        <div id="atividade-info-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 text-gray-300"></div>

        <button id="participar-btn" disabled class="w-full bg-neon-blue text-black py-4 rounded-lg font-bold text-lg flex justify-center items-center gap-2 hover:bg-white hover:shadow-[0_0_15px_rgba(0,229,255,0.6)] disabled:bg-gray-800 disabled:text-gray-500 disabled:shadow-none disabled:cursor-not-allowed transition duration-300 shadow-[0_0_10px_rgba(0,229,255,0.3)] mb-8">
          <i class="fa-solid fa-spinner fa-spin"></i> Carregando...
        </button>

        <div id="participantes-container" class="bg-black/30 rounded-lg p-6 mb-8 border border-gray-800"></div>

        <div id="mapa-section" class="bg-black/30 rounded-lg p-6 border border-gray-800 hidden">
          <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-map-location-dot text-neon-blue"></i> Localização</h3>
          <div id="map" class="h-96 w-full rounded-lg shadow-inner z-0"></div>
        </div>
    </div>
  </main>

  <footer class="bg-black border-t border-gray-900 text-white py-8 mt-auto text-center">
    <p class="text-gray-500 text-sm">&copy; 2025 Se Mexe. Direitos Reservados.</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/atividade.js"></script>
  <script>
      const btn = document.getElementById('hamburger-btn');
      const menu = document.getElementById('nav-menu-wrapper');
      if(btn && menu){
          btn.addEventListener('click', () => {
              btn.classList.toggle('active');
              menu.classList.toggle('translate-x-full');
              menu.classList.toggle('translate-x-0');
          });
      }
  </script>
</body>
</html>
