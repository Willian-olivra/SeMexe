    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#00E5FF',
                        'neon-pink': '#FF007F',
                        'dark-base': '#121212',
                        'dark-surface': '#1E1E1E',
                        'dark-highlight': '#2D2D2D',
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap');</style>
</head>
<body class="bg-dark-base text-gray-200 font-sans min-h-screen flex flex-col selection:bg-neon-blue selection:text-black">

    <header class="bg-dark-surface py-4 border-b border-gray-800 sticky top-0 z-50 shadow-lg">
        <nav class="container mx-auto px-5">
            <a href="index.html" class="text-2xl font-bold text-neon-blue italic flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Se Mexe
            </a>
        </nav>
    </header>
            
    <main class="container mx-auto px-5 py-10 flex-grow">
        <div class="mb-6 max-w-md mx-auto">
            <a href="index.html" class="inline-flex items-center gap-2 text-neon-blue font-medium hover:text-white transition">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </a>
        </div>

        <div class="max-w-md mx-auto bg-dark-surface border border-gray-800 rounded-xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-white text-center mb-8">Crie sua Conta</h2>
            
            <form id="register-form" class="space-y-5"> 
                <div>
                    <label for="name" class="block text-gray-400 font-medium mb-2">Nome Completo</label>
                    <input type="text" id="name" name="name" required class="w-full bg-dark-highlight border border-gray-700 text-white rounded-md p-3 focus:outline-none focus:border-neon-blue focus:ring-1 focus:ring-neon-blue transition">
                </div>
                <div>
                    <label for="email" class="block text-gray-400 font-medium mb-2">Email</label>
                    <input type="email" id="email" name="email" required class="w-full bg-dark-highlight border border-gray-700 text-white rounded-md p-3 focus:outline-none focus:border-neon-blue focus:ring-1 focus:ring-neon-blue transition">
                </div>
                <div>
                    <label for="password" class="block text-gray-400 font-medium mb-2">Senha</label>
                    <input type="password" id="password" name="password" required minlength="6" class="w-full bg-dark-highlight border border-gray-700 text-white rounded-md p-3 focus:outline-none focus:border-neon-blue focus:ring-1 focus:ring-neon-blue transition">
                </div>
                
                <p class="text-center text-gray-500">Já possui uma conta? <a href="login.html" class="text-neon-blue font-bold hover:text-white transition">Entre Aqui</a></p>
                
                <p id="auth-status" class="text-center text-sm h-5 text-neon-pink font-medium mb-4"></p>
                
                <button type="submit" class="w-full bg-neon-blue text-black font-bold text-lg py-3 rounded-md hover:bg-white hover:shadow-[0_0_15px_rgba(0,229,255,0.6)] transition shadow-lg cursor-pointer">Cadastrar</button>
            </form>
        </div>
    </main>

    <footer class="bg-black border-t border-gray-900 text-white py-8 mt-auto text-center">
        <p class="text-gray-500 text-sm">&copy; 2025 Se Mexe. Direitos Reservados.</p>
    </footer>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
