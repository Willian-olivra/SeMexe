    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'neon-blue': '#00E5FF', 'dark-base': '#121212', 'dark-surface': '#1E1E1E' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-dark-base text-white font-sans flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-dark-surface p-8 rounded-xl shadow-lg border border-gray-800">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white italic"><i class="fa-solid fa-bolt text-neon-blue"></i> Se Mexe</h1>
            <p class="text-gray-400 mt-2">Acesse sua conta</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-gray-400 text-sm mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-[#121212] border border-gray-700 rounded p-3 text-white focus:border-neon-blue focus:outline-none transition">
            </div>

            <div>
                <label for="password" class="block text-gray-400 text-sm mb-1">Senha</label>
                <input type="password" id="password" required class="w-full bg-[#121212] border border-gray-700 rounded p-3 text-white focus:border-neon-blue focus:outline-none transition">
            </div>

            <div class="text-right">
                <a href="esqueciSenha.html" class="text-neon-blue text-sm hover:text-white hover:underline transition">Esqueci minha senha</a>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-neon-blue text-black font-bold py-3 rounded hover:bg-white hover:shadow-[0_0_15px_rgba(0,229,255,0.5)] transition duration-300">
                Entrar
            </button>
        </form>

        <p id="msg-erro" class="text-center text-neon-pink mt-4 text-sm font-bold"></p>

        <div class="mt-6 text-center border-t border-gray-700 pt-4">
            <p class="text-gray-400 text-sm">Ainda não tem conta? <a href="cadastro.html" class="text-neon-blue font-bold hover:underline">Cadastre-se</a></p>
        </div>
        <div class="mt-2 text-center">
             <a href="index.html" class="text-gray-500 text-sm hover:text-white">Voltar ao início</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg-erro');
            const btn = document.getElementById('btn-login');

            btn.disabled = true;
            btn.innerText = "Entrando...";
            msg.innerText = "";

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }) // No backend espera { email, password }
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    msg.innerText = data.error || "Login falhou.";
                    btn.disabled = false;
                    btn.innerText = "Entrar";
                }
            } catch (err) {
                msg.innerText = "Erro ao conectar com o servidor.";
                btn.disabled = false;
                btn.innerText = "Entrar";
            }
        });
    </script>
</body>
</html>
