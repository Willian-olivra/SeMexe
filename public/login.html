<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Seguro - Se Mexe</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'neon-blue': '#00E5FF', 'dark-base': '#121212', 'dark-surface': '#1E1E1E' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        .hidden-step { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-dark-base text-white font-sans flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-md bg-dark-surface p-8 rounded-xl shadow-lg border border-gray-800 relative overflow-hidden">
        
        <div id="step-1" class="fade-in">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white italic"><i class="fa-solid fa-bolt text-neon-blue"></i> Se Mexe</h1>
                <p class="text-gray-400 mt-2">Acesse sua conta</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Email</label>
                    <input type="email" id="email" required class="w-full bg-[#121212] border border-gray-700 rounded p-3 text-white focus:border-neon-blue focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Senha</label>
                    <input type="password" id="password" required class="w-full bg-[#121212] border border-gray-700 rounded p-3 text-white focus:border-neon-blue focus:outline-none transition">
                </div>
                <div class="text-right">
                    <a href="esqueciSenha.html" class="text-neon-blue text-sm hover:underline">Esqueci minha senha</a>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-neon-blue text-black font-bold py-3 rounded hover:bg-white transition duration-300">
                    Entrar
                </button>
            </form>
        </div>

        <div id="step-2" class="hidden-step fade-in text-center">
            <div class="mb-6">
                <i class="fa-solid fa-shield-halved text-5xl text-neon-blue mb-4"></i>
                <h2 class="text-2xl font-bold text-white">Verificação de Segurança</h2>
                <p class="text-gray-400 text-sm mt-2">Enviamos um código para seu e-mail.</p>
            </div>

            <form id="verify-form" class="space-y-5">
                <div>
                    <input type="text" id="otp-code" placeholder="000000" maxlength="6" required class="w-full bg-[#121212] border border-gray-700 rounded p-3 text-white text-center text-2xl tracking-[10px] focus:border-neon-blue focus:outline-none transition font-mono">
                </div>

                <button type="submit" id="btn-verify" class="w-full bg-green-500 text-black font-bold py-3 rounded hover:bg-white transition duration-300">
                    Verificar Código
                </button>
            </form>
            
            <p class="mt-4 text-xs text-gray-500">Não recebeu? Verifique o Spam.</p>
        </div>

        <p id="msg-erro" class="text-center text-neon-pink mt-4 text-sm font-bold min-h-[20px]"></p>

        <div id="footer-links" class="mt-6 text-center border-t border-gray-700 pt-4">
            <p class="text-gray-400 text-sm">Ainda não tem conta? <a href="cadastro.html" class="text-neon-blue font-bold hover:underline">Cadastre-se</a></p>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const msg = document.getElementById('msg-erro');
        const footer = document.getElementById('footer-links');
        
        let userEmail = ''; // Guarda o email para o passo 2

        // --- PASSO 1: LOGIN (Envia senha, recebe pedido de 2FA) ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            btn.disabled = true;
            btn.innerText = "Verificando...";
            msg.innerText = "";

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.require2FA) {
                    // SUCESSO PARCIAL: Senha certa, agora pede código
                    userEmail = data.email;
                    
                    // Troca de tela
                    step1.classList.add('hidden-step');
                    footer.classList.add('hidden-step');
                    step2.classList.remove('hidden-step');
                    
                    msg.className = "text-center text-green-400 mt-4 text-sm font-bold";
                    msg.innerText = "Código enviado!";
                    
                    document.getElementById('otp-code').focus();

                } else if (res.ok && data.token) {
                    // CASO DE LOGIN DIRETO (Se vc desativar 2FA no futuro)
                    finalizarLogin(data);
                } else {
                    throw new Error(data.error || "Login falhou.");
                }
            } catch (err) {
                msg.className = "text-center text-neon-pink mt-4 text-sm font-bold";
                msg.innerText = err.message;
                btn.disabled = false;
                btn.innerText = "Entrar";
            }
        });

        // --- PASSO 2: VERIFICAR CÓDIGO ---
        document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('otp-code').value;
            const btn = document.getElementById('btn-verify');

            btn.disabled = true;
            btn.innerText = "Validando...";
            msg.innerText = "";

            try {
                const res = await fetch('/api/users/login/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, code })
                });

                const data = await res.json();

                if (res.ok) {
                    finalizarLogin(data);
                } else {
                    throw new Error(data.error || "Código incorreto.");
                }
            } catch (err) {
                msg.className = "text-center text-neon-pink mt-4 text-sm font-bold";
                msg.innerText = err.message;
                btn.disabled = false;
                btn.innerText = "Verificar Código";
            }
        });

        function finalizarLogin(data) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('userInfo', JSON.stringify(data.user));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
