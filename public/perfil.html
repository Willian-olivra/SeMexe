<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se Mexe - Meu Perfil</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMjAgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZmlsbD0iIzAwRTVGRiIgZD0iTTI5NiAxNjBIMTgwLjZsNDIuNi0xMjkuOEMyMjcuMiAxNSAyMTUuNyAwIDIwMCAwSDU2QzQ0IDAgMzMuOCA4LjkgMzIuMiAyMC44bC0zMiAyNDBDLTEuNyAyNzUuMiA5LjUgMjg4IDI0IDI4OGgxMTUuNEw5Ni44IDQxNy44Yy00IDE1LjIgNy41IDMwLjIgMjMuMiAzMC4yYzUuOSAwIDExLjYtMi4yIDE1LjgtNi40bDE5Mi0xOTJjMTMuMy0xMy4zIDEyLjUtMzUuNS0yLTQ3Ljh6Ii8+PC9zdmc+" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#00E5FF',
                        'neon-pink': '#FF007F',
                        'dark-base': '#121212',
                        'dark-surface': '#1E1E1E',
                        'dark-highlight': '#2D2D2D',
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    backgroundImage: {
                        'hero-pattern': "url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=2070&auto=format&fit=crop')"
                    }
                }
            }
        }
    </script>
    <style>
        #nav-menu a { color: #e5e7eb; font-weight: 500; transition: all 0.3s ease; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        #nav-menu a:hover { color: #00E5FF; text-shadow: 0 0 10px rgba(0, 229, 255, 0.8); }
        .hamburger-toggle .line { transition: all 0.3s ease-in-out; }
        .hamburger-toggle.active .line-1 { transform: translateY(8px) rotate(45deg); }
        .hamburger-toggle.active .line-2 { opacity: 0; }
        .hamburger-toggle.active .line-3 { transform: translateY(-8px) rotate(-45deg); }
        input[type="file"] { display: none; }
        html { scroll-behavior: smooth; }
        body.has-bottom-nav footer { padding-bottom: 90px; }
    </style>
</head>
<body class="bg-dark-base text-gray-200 font-sans min-h-screen flex flex-col selection:bg-neon-blue selection:text-black">

    <div class="relative w-full h-[45vh] md:h-[50vh] flex flex-col overflow-hidden">
        <div class="absolute inset-0 bg-hero-pattern bg-cover bg-center bg-fixed animate-[pulse_30s_ease-in-out_infinite] scale-105"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-black/60 to-dark-base"></div>

        <header class="absolute top-0 left-0 w-full z-50 py-6">
            <nav class="container mx-auto px-5 flex justify-between items-center relative">
                <a href="index.html" class="text-3xl font-black text-white italic flex items-center gap-2 tracking-tighter drop-shadow-lg">
                    <i class="fa-solid fa-bolt text-neon-blue"></i> Se<span class="text-neon-blue">Mexe</span>
                </a>
                
                <button id="hamburger-btn" aria-label="Abrir menu principal" class="hamburger-toggle md:hidden flex flex-col gap-1.5 cursor-pointer z-50">
                    <span class="line line-1 block w-6 h-0.5 bg-neon-blue"></span>
                    <span class="line line-2 block w-6 h-0.5 bg-neon-blue"></span>
                    <span class="line line-3 block w-6 h-0.5 bg-neon-blue"></span>
                </button>

                <div id="nav-menu-wrapper" class="fixed inset-0 bg-dark-base/95 backdrop-blur-md flex flex-col items-center justify-center gap-8 text-xl transition-transform duration-300 translate-x-full md:translate-x-0 md:static md:bg-transparent md:flex-row md:gap-8 md:text-base md:h-auto md:border-none">
                    <ul id="nav-menu" class="flex flex-col md:flex-row gap-6 items-center mb-4 md:mb-0"></ul>
                </div>
            </nav>
        </header>
    </div>

    <main class="container mx-auto px-5 flex-grow -mt-32 relative z-40 pb-20">
        
        <form id="form-perfil" class="max-w-5xl mx-auto">
            
            <div class="bg-dark-surface/90 backdrop-blur-md border border-gray-700 rounded-2xl shadow-2xl overflow-hidden mb-8">
                
                <div class="h-24 bg-gradient-to-r from-gray-800 to-black relative">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-neon-blue to-neon-pink"></div>
                </div>

                <div class="px-8 pb-8">
                    <div class="relative -mt-16 mb-8 flex flex-col md:flex-row items-center md:items-end gap-6">
                        
                        <div class="relative group">
                            <div class="w-32 h-32 rounded-full border-4 border-dark-surface bg-dark-highlight overflow-hidden shadow-xl flex items-center justify-center relative">
                                <img id="profile-img-preview" src="" alt="Foto" class="w-full h-full object-cover hidden">
                                <i id="profile-icon-default" class="fa-solid fa-user text-5xl text-gray-500"></i>
                                <div id="img-loading" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden"><i class="fa-solid fa-spinner fa-spin text-neon-blue"></i></div>
                            </div>
                            <label for="upload-avatar" class="absolute bottom-0 right-0 bg-neon-blue text-black w-9 h-9 rounded-full flex items-center justify-center cursor-pointer shadow-lg hover:scale-110 transition border-4 border-dark-surface z-10"><i class="fa-solid fa-camera text-sm"></i></label>
                            <input type="file" id="upload-avatar" accept="image/png, image/jpeg">
                        </div>

                        <div class="text-center md:text-left flex-1 w-full md:w-auto">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Nome de Atleta</label>
                            <input type="text" id="input-nome" class="text-3xl font-bold text-white bg-transparent border-b-2 border-transparent hover:border-gray-700 focus:border-neon-blue focus:outline-none w-full md:w-auto transition px-1" placeholder="Seu Nome">
                            <div class="text-gray-400 text-sm mt-1" id="display-email">...</div>
                        </div>

                        <div class="flex gap-3">
                            <div class="text-center bg-black/30 p-3 rounded-xl border border-gray-700 min-w-[80px]">
                                <span class="block text-2xl font-bold text-yellow-400" id="stat-fairplay">-</span>
                                <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Fairplay</span>
                            </div>
                            <div class="text-center bg-black/30 p-3 rounded-xl border border-gray-700 min-w-[80px]">
                                <span class="block text-2xl font-bold text-red-400" id="stat-faltas">0</span>
                                <span class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Faltas</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 border-t border-gray-800 pt-8">
                        
                        <div class="space-y-6">
                            <div>
                                <label class="flex items-center gap-2 text-gray-400 font-bold text-xs uppercase tracking-wider mb-2">
                                    <i class="fa-solid fa-quote-left text-neon-blue"></i> Sobre Mim
                                </label>
                                <textarea id="input-bio" rows="3" class="w-full bg-dark-highlight border border-gray-700 text-gray-300 rounded-xl p-4 focus:border-neon-blue focus:ring-1 focus:ring-neon-blue focus:outline-none transition resize-none text-sm leading-relaxed" placeholder="Conte um pouco sobre seu estilo de jogo, posição preferida..."></textarea>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-gray-400 font-bold text-xs uppercase tracking-wider mb-2">Cidade / Bairro</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-location-dot absolute left-3 top-3 text-gray-500"></i>
                                        <input type="text" id="input-cidade" class="w-full bg-dark-highlight border border-gray-700 text-white rounded-lg p-2.5 pl-9 focus:border-neon-blue focus:outline-none text-sm" placeholder="Pelotas, Centro">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-gray-400 font-bold text-xs uppercase tracking-wider mb-2">Instagram</label>
                                    <div class="relative">
                                        <i class="fa-brands fa-instagram absolute left-3 top-3 text-gray-500"></i>
                                        <input type="text" id="input-instagram" class="w-full bg-dark-highlight border border-gray-700 text-white rounded-lg p-2.5 pl-9 focus:border-neon-pink focus:outline-none text-sm" placeholder="@seu.perfil">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="flex items-center gap-2 text-gray-400 font-bold text-xs uppercase tracking-wider mb-4">
                                <i class="fa-solid fa-medal text-neon-blue"></i> O que você joga?
                            </label>
                            
                            <div class="flex flex-wrap gap-3" id="container-esportes">
                                <button type="button" class="sport-tag px-4 py-2 rounded-lg border border-gray-700 bg-dark-base text-gray-400 hover:border-gray-500 transition flex items-center gap-2" data-sport="Futebol">
                                    <i class="fa-solid fa-futbol"></i> Futebol
                                </button>
                                <button type="button" class="sport-tag px-4 py-2 rounded-lg border border-gray-700 bg-dark-base text-gray-400 hover:border-gray-500 transition flex items-center gap-2" data-sport="Vôlei">
                                    <i class="fa-solid fa-volleyball"></i> Vôlei
                                </button>
                                <button type="button" class="sport-tag px-4 py-2 rounded-lg border border-gray-700 bg-dark-base text-gray-400 hover:border-gray-500 transition flex items-center gap-2" data-sport="Basquete">
                                    <i class="fa-solid fa-basketball"></i> Basquete
                                </button>
                                <button type="button" class="sport-tag px-4 py-2 rounded-lg border border-gray-700 bg-dark-base text-gray-400 hover:border-gray-500 transition flex items-center gap-2" data-sport="Corrida">
                                    <i class="fa-solid fa-person-running"></i> Corrida
                                </button>
                                <button type="button" class="sport-tag px-4 py-2 rounded-lg border border-gray-700 bg-dark-base text-gray-400 hover:border-gray-500 transition flex items-center gap-2" data-sport="Natação">
                                    <i class="fa-solid fa-person-swimming"></i> Natação
                                </button>
                                <button type="button" class="sport-tag px-4 py-2 rounded-lg border border-gray-700 bg-dark-base text-gray-400 hover:border-gray-500 transition flex items-center gap-2" data-sport="Academia">
                                    <i class="fa-solid fa-dumbbell"></i> Academia
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 border-t border-gray-800 pt-8 mt-8">
                        
                        <div>
                            <h3 class="text-gray-400 font-bold text-xs uppercase tracking-wider mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-user-clock text-neon-blue"></i> Solicitações Pendentes
                            </h3>
                            <div id="lista-solicitacoes" class="space-y-3">
                                <p class="text-gray-500 text-sm">Carregando...</p>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-gray-400 font-bold text-xs uppercase tracking-wider mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-user-group text-neon-blue"></i> Meus Amigos
                            </h3>
                            <div id="lista-amigos" class="space-y-3">
                                <p class="text-gray-500 text-sm">Carregando...</p>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

            <div class="flex justify-end sticky bottom-6 z-50">
                <button type="submit" id="btn-salvar" class="bg-neon-blue text-black font-bold px-8 py-4 rounded-full shadow-[0_0_20px_rgba(0,229,255,0.4)] hover:bg-white hover:scale-105 transition transform flex items-center gap-3">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Perfil
                </button>
            </div>

        </form>
    </main>

    <footer class="bg-black border-t border-gray-900 text-white py-12 mt-auto text-center">
        <h4 class="text-2xl font-black italic mb-2 text-white flex justify-center items-center gap-2"><i class="fa-solid fa-bolt text-neon-blue"></i> Se Mexe</h4>
        <p class="text-gray-500 text-sm">&copy; 2025 Se Mexe. Direitos Reservados.</p>
    </footer>
    
    <script src="js/utils.js"></script>
    <script src="js/perfil.js"></script>
    
    <script>
        const btn = document.getElementById('hamburger-btn');
        const menu = document.getElementById('nav-menu-wrapper');
        if(btn && menu){
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
                menu.classList.toggle('translate-x-full');
                menu.classList.toggle('translate-x-0');
            });
        }
    </script>
</body>
</html>
